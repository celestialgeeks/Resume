<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1100" width="850" height="1100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="850" height="1100" rx="16" fill="url(#bg)" />

  <!-- Outer Glow Card -->
  <rect x="40" y="40" width="770" height="1020" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#shadow)" />

  <!-- Top Accent Bar -->
  <rect x="40" y="40" width="770" height="8" rx="4" fill="url(#accent)" />

  <!-- Document Icon -->
  <g transform="translate(375, 240)">
    <rect x="0" y="0" width="100" height="130" rx="8" fill="#334155" stroke="#64748b" stroke-width="2" />
    <polygon points="70,0 100,30 70,30" fill="#475569" />
    <line x1="20" y1="50" x2="80" y2="50" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="20" y1="70" x2="80" y2="70" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="20" y1="90" x2="60" y2="90" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Header Title -->
  <text x="425" y="430" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f8fafc">
    Master Resume Ready for Ingestion
  </text>

  <!-- Subtitle -->
  <text x="425" y="470" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">
    Drop your master resume.tex and resume.pdf into master/ or inbox/
  </text>

  <!-- Step Box 1 -->
  <rect x="140" y="530" width="570" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <circle cx="185" cy="570" r="18" fill="#38bdf8" />
  <text x="185" y="576" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#0f172a">1</text>
  <text x="225" y="562" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">
    Drop your master files
  </text>
  <text x="225" y="586" font-family="monospace" font-size="13" fill="#94a3b8">
    Place resume.tex and resume.pdf into master/
  </text>

  <!-- Step Box 2 -->
  <rect x="140" y="630" width="570" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <circle cx="185" cy="670" r="18" fill="#818cf8" />
  <text x="185" y="676" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#0f172a">2</text>
  <text x="225" y="662" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">
    Run the master intake command
  </text>
  <text x="225" y="686" font-family="monospace" font-size="13" fill="#94a3b8">
    ./archive.sh --master
  </text>

  <!-- Step Box 3 -->
  <rect x="140" y="730" width="570" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <circle cx="185" cy="770" r="18" fill="#34d399" />
  <text x="185" y="776" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#0f172a">3</text>
  <text x="225" y="762" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">
    Instant high-res preview & sync
  </text>
  <text x="225" y="786" font-family="monospace" font-size="13" fill="#94a3b8">
    Auto-generates preview image and updates this showcase
  </text>

  <!-- Footer Tag -->
  <rect x="290" y="870" width="270" height="38" rx="19" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="425" y="894" text-anchor="middle" font-family="monospace" font-size="13" fill="#38bdf8">
    Resume Version Hub
  </text>
</svg>
